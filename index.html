<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Strategy Crypto Scanner Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --border-color: #2b313a;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --bullish-color: #0ecb81;
            --bearish-color: #f6465d;
            --accent-color: #f0b90b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
        }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #161a1e;
            color: var(--text-muted);
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            text-align: center;
        }

        .badge-bullish {
            background-color: rgba(14, 203, 129, 0.15);
            color: var(--bullish-color);
            border: 1px solid var(--bullish-color);
        }

        .badge-bearish {
            background-color: rgba(246, 70, 93, 0.15);
            color: var(--bearish-color);
            border: 1px solid var(--bearish-color);
        }

        .badge-neutral {
            background-color: rgba(132, 142, 156, 0.15);
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
        }

        .mtf-matrix {
            display: flex;
            gap: 4px;
        }

        .mtf-dot {
            width: 22px;
            height: 22px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .dot-green { background-color: var(--bullish-color); color: #000; }
        .dot-red { background-color: var(--bearish-color); color: #fff; }

        .price-up { color: var(--bullish-color); }
        .price-down { color: var(--bearish-color); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Trading Strategy Scanner</h1>
        <div class="status-bar" id="lastUpdated">Status: Ready to scan</div>
    </div>

    <div class="controls">
        <button id="scanBtn" onclick="runScan()">Run Live Market Scan</button>
        <div class="filter-group">
            <label for="signalFilter">Filter Signal:</label>
            <select id="signalFilter" onchange="filterResults()">
                <option value="ALL">Show All Symbols</option>
                <option value="BULLISH">Bullish Only</option>
                <option value="BEARISH">Bearish Only</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>24h Change</th>
                    <th>Zero-Lag MTF Trend</th>
                    <th>SMC Market Structure</th>
                    <th>Order Block Volume Delta</th>
                    <th>Overall Action</th>
                </tr>
            </thead>
            <tbody id="scannerBody">
                <tr>
                    <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">
                        Click "Run Live Market Scan" to fetch live data from Binance.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const SYMBOLS = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "TAOUSDT", "XRPUSDT", "BONKUSDT"];
        let scannerData = [];

        async function fetchKlineData(symbol, interval = '15m', limit = 100) {
            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
                const data = await response.json();
                return data.map(d => ({
                    time: d[0],
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                    volume: parseFloat(d[5])
                }));
            } catch (error) {
                console.error(`Error fetching data for ${symbol}:`, error);
                return null;
            }
        }

        // Logic 1: Zero-Lag EMA & MTF Signals Calculation
        function calculateZeroLagTrend(klines) {
            const length = 70;
            const lag = Math.floor((length - 1) / 2);
            if (klines.length < length) return "NEUTRAL";

            let closes = klines.map(k => k.close);
            let lastClose = closes[closes.length - 1];
            
            // Lag corrected price series
            let lagCorrected = closes.map((c, i) => {
                if (i < lag) return c;
                return c + (c - closes[i - lag]);
            });

            // Exponential Moving Average
            let k = 2 / (length + 1);
            let ema = lagCorrected[0];
            for (let i = 1; i < lagCorrected.length; i++) {
                ema = lagCorrected[i] * k + ema * (1 - k);
            }

            return lastClose > ema ? "BULLISH" : "BEARISH";
        }

        // Logic 2: Smart Money Concepts (BOS / CHoCH) Analysis
        function calculateSMCStructure(klines) {
            if (klines.length < 20) return { structure: "NEUTRAL", detail: "Consolidation" };
            
            let recentHighs = Math.max(...klines.slice(-10).map(k => k.high));
            let recentLows = Math.min(...klines.slice(-10).map(k => k.low));
            let lastClose = klines[klines.length - 1].close;

            if (lastClose >= recentHighs) {
                return { structure: "BULLISH", detail: "Bullish BOS / CHoCH Breakout" };
            } else if (lastClose <= recentLows) {
                return { structure: "BEARISH", detail: "Bearish BOS / CHoCH Breakdown" };
            }
            return { structure: "NEUTRAL", detail: "Inside Swing Range" };
        }

        // Logic 3: Order Block Volume Delta Analysis
        function calculateOBVolumeDelta(klines) {
            let bullishVol = 0;
            let bearishVol = 0;
            let recent = klines.slice(-20);

            recent.forEach(k => {
                if (k.close > k.open) bullishVol += k.volume;
                else bearishVol += k.volume;
            });

            let delta = bullishVol - bearishVol;
            if (delta > 0) {
                return { bias: "BULLISH", text: `+${(delta/1000).toFixed(1)}k Delta (Demand OB)` };
            } else {
                return { bias: "BEARISH", text: `${(delta/1000).toFixed(1)}k Delta (Supply OB)` };
            }
        }

        async function runScan() {
            const scanBtn = document.getElementById('scanBtn');
            const statusEl = document.getElementById('lastUpdated');
            scanBtn.disabled = true;
            statusEl.innerText = "Status: Scanning market tickers...";

            scannerData = [];
            const tbody = document.getElementById('scannerBody');
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--accent-color); padding: 30px;">Analyzing live candle data and market structures...</td></tr>`;

            for (let symbol of SYMBOLS) {
                const klines15m = await fetchKlineData(symbol, '15m', 100);
                const klines1h = await fetchKlineData(symbol, '1h', 100);
                const klines4h = await fetchKlineData(symbol, '4h', 100);

                if (!klines15m || klines15m.length === 0) continue;

                let lastClose = klines15m[klines15m.length - 1].close;
                let prevClose = klines15m[0].close;
                let priceChange = (((lastClose - prevClose) / prevClose) * 100).toFixed(2);

                // Calculations based on Pine Script logic
                let zlema5m = calculateZeroLagTrend(klines15m.slice(-30));
                let zlema15m = calculateZeroLagTrend(klines15m);
                let zlema1h = calculateZeroLagTrend(klines1h || klines15m);
                let zlema4h = calculateZeroLagTrend(klines4h || klines15m);

                let smc = calculateSMCStructure(klines15m);
                let ob = calculateOBVolumeDelta(klines15m);

                // Combine overall signal
                let bullPoints = (zlema15m === "BULLISH" ? 1 : 0) + (smc.structure === "BULLISH" ? 1 : 0) + (ob.bias === "BULLISH" ? 1 : 0);
                let bearPoints = (zlema15m === "BEARISH" ? 1 : 0) + (smc.structure === "BEARISH" ? 1 : 0) + (ob.bias === "BEARISH" ? 1 : 0);

                let overallAction = "NEUTRAL";
                if (bullPoints >= 2) overallAction = "BULLISH";
                if (bearPoints >= 2) overallAction = "BEARISH";

                scannerData.push({
                    symbol,
                    price: lastClose,
                    priceChange,
                    zlemaMTF: { m5: zlema5m, m15: zlema15m, h1: zlema1h, h4: zlema4h },
                    smc,
                    ob,
                    overallAction
                });
            }

            renderTable(scannerData);
            statusEl.innerText = `Last Updated: ${new Date().toLocaleTimeString()}`;
            scanBtn.disabled = false;
        }

        function renderTable(data) {
            const tbody = document.getElementById('scannerBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No symbols found matching filter.</td></tr>`;
                return;
            }

            data.forEach(row => {
                let changeClass = row.priceChange >= 0 ? 'price-up' : 'price-down';
                let changeSign = row.priceChange >= 0 ? '+' : '';

                let overallBadge = row.overallAction === 'BULLISH' 
                    ? `<span class="badge badge-bullish">LONG / BULLISH</span>` 
                    : row.overallAction === 'BEARISH'
                    ? `<span class="badge badge-bearish">SHORT / BEARISH</span>`
                    : `<span class="badge badge-neutral">NEUTRAL</span>`;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${row.symbol}</strong></td>
                    <td>${row.price < 1 ? row.price.toFixed(6) : row.price.toFixed(2)}</td>
                    <td class="${changeClass}">${changeSign}${row.priceChange}%</td>
                    <td>
                        <div class="mtf-matrix">
                            <div class="mtf-dot ${row.zlemaMTF.m5 === 'BULLISH' ? 'dot-green' : 'dot-red'}" title="5m Trend">5m</div>
                            <div class="mtf-dot ${row.zlemaMTF.m15 === 'BULLISH' ? 'dot-green' : 'dot-red'}" title="15m Trend">15m</div>
                            <div class="mtf-dot ${row.zlemaMTF.h1 === 'BULLISH' ? 'dot-green' : 'dot-red'}" title="1h Trend">1h</div>
                            <div class="mtf-dot ${row.zlemaMTF.h4 === 'BULLISH' ? 'dot-green' : 'dot-red'}" title="4h Trend">4h</div>
                        </div>
                    </td>
                    <td><span class="badge ${row.smc.structure === 'BULLISH' ? 'badge-bullish' : row.smc.structure === 'BEARISH' ? 'badge-bearish' : 'badge-neutral'}">${row.smc.detail}</span></td>
                    <td><span style="color: ${row.ob.bias === 'BULLISH' ? 'var(--bullish-color)' : 'var(--bearish-color)'}">${row.ob.text}</span></td>
                    <td>${overallBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterResults() {
            const filterValue = document.getElementById('signalFilter').value;
            if (filterValue === 'ALL') {
                renderTable(scannerData);
            } else {
                let filtered = scannerData.filter(d => d.overallAction === filterValue);
                renderTable(filtered);
            }
        }
    </script>
</body>
</html>

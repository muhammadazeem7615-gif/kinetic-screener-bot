<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Timeframe Futures Liquidity Scanner</title>

  <style>
    :root {
      --bg: #0b0e11;
      --panel: #151a21;
      --panel2: #1e2329;
      --border: #2b313a;
      --text: #eaecef;
      --muted: #848e9c;
      --green: #0ecb81;
      --red: #f6465d;
      --yellow: #f0b90b;
      --blue: #2962ff;
      --purple: #9c27b0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .container {
      max-width: 1900px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    #status {
      color: var(--muted);
      text-align: right;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      min-height: 36px;
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--blue);
    }

    button {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: var(--panel2);
      border-color: var(--border);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .checkboxes {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 8px;
    }

    .checkboxes label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text);
      text-transform: none;
      font-size: 12px;
    }

    .progress {
      display: none;
      height: 5px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 3px;
      background: var(--border);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--blue);
      transition: width 0.15s;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 16px;
      color: var(--muted);
    }

    .summary strong {
      color: var(--text);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 1400px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--panel2);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .bull {
      color: var(--green);
    }

    .bear {
      color: var(--red);
    }

    .warn {
      color: var(--yellow);
    }

    .muted {
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    .badge-bull {
      color: var(--green);
      border: 1px solid var(--green);
      background: rgba(14, 203, 129, 0.12);
    }

    .badge-bear {
      color: var(--red);
      border: 1px solid var(--red);
      background: rgba(246, 70, 93, 0.12);
    }

    .badge-test {
      color: var(--yellow);
      border: 1px solid var(--yellow);
      background: rgba(240, 185, 11, 0.12);
    }

    .badge-breaker {
      color: #d48cff;
      border: 1px solid var(--purple);
      background: rgba(156, 39, 176, 0.12);
    }

    .error {
      color: var(--red);
    }
  </style>
</head>

  <header>
    <h1>Multi-Timeframe Futures Liquidity Scanner</h1>
    <div id="status">Ready</div>
  </header>

  <div class="panel">

        <input

        <input id="maxAge" type="number" value="100" min="5" max="500">

      <div class="control">
        <label>Stop buffer ATR</label>
        <input id="stopBuffer" type="number" value="1.5" min="0.1" step="0.1">

        <label>Minimum R:R</label>
        <input id="minRR" type="number" value="1.2" min="0.1" step="0.1">
      </div>

        <label>Target buffer ATR</label>
        <input id="targetBuffer" type="number" value="0.05" min="0" step="0.01">
      </div>

      <div class="control">
        <label>Batch size</label>
        <input id="batchSize" type="number" value="8" min="1" max="20">

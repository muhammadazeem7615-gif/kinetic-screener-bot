<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futures Momentum Scanner</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0b0e11;
      --card: #181a20;
      --border: #2b313a;
      --text: #eaecef;
      --green: #0ecb81;
      --red: #f6465d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .controls {
      display: flex;
      gap: 15px;
      margin: 20px 0;
    }
    select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      border-color: var(--green);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .symbol {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .badge.long { background: rgba(14, 203, 129, 0.2); color: var(--green); }
    .badge.short { background: rgba(246, 70, 93, 0.2); color: var(--red); }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.9rem;
    }
    .val-long { color: var(--green); font-weight: bold; }
    .val-short { color: var(--red); font-weight: bold; }
    #status { color: #848e9c; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Binance Futures Scanner</h2>
    <div id="status">Status: Idle</div>
  </div>

  <div class="controls">
    <select id="timeframe">
      <option value="30m" selected>30m Timeframe</option>
      <option value="4h">4h Timeframe</option>
    </select>
    <button onclick="startScan()">Run Full Scan</button>
  </div>

  <div class="grid" id="signals"></div>

  <script>
    const BINANCE_BASE = 'https://fapi.binance.com';

    // Calculate Average True Range (ATR)
    function calculateATR(candles, period = 14) {
      let trs = [];
      for (let i = 1; i < candles.length; i++) {
        const high = candles[i].high;
        const low = candles[i].low;
        const prevClose = candles[i - 1].close;
        const tr = Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
        trs.push(tr);
      }
      const slice = trs.slice(-period);
      return slice.reduce((a, b) => a + b, 0) / period;
    }

    // Calculate Exponential Moving Average (EMA)
    function calculateEMA(candles, period) {
      const k = 2 / (period + 1);
      let ema = candles[0].close;
      for (let i = 1; i < candles.length; i++) {
        ema = candles[i].close * k + ema * (1 - k);
      }
      return ema;
    }

    async function getUsdtPairs() {
      const res = await fetch(`${BINANCE_BASE}/fapi/v1/exchangeInfo`);
      const data = await res.json();
      return data.symbols
        .filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING')
        .map(s => s.symbol);
    }

    async function analyzeSymbol(symbol, timeframe) {
      try {
        const res = await fetch(`${BINANCE_BASE}/fapi/v1/klines?symbol=${symbol}&interval=${timeframe}&limit=50`);
        const raw = await res.json();
        const candles = raw.map(c => ({
          open: parseFloat(c[1]),
          high: parseFloat(c[2]),
          low: parseFloat(c[3]),
          close: parseFloat(c[4]),
        }));

        const last = candles[candles.length - 1];
        const prev = candles[candles.length - 2];

        const emaFast = calculateEMA(candles, 2);
        const emaSlow = calculateEMA(candles, 5);
        const atr = calculateATR(candles, 14);

        const isBullAccel = (emaFast > emaSlow) && (last.close > prev.close);
        const isBearAccel = (emaFast < emaSlow) && (last.close < prev.close);

        if (isBullAccel) {
          return {
            symbol,
            type: 'LONG',
            price: last.close,
            sl: last.close - (atr * 2),
            tp: last.close + (atr * 3)
          };
        } else if (isBearAccel) {
          return {
            symbol,
            type: 'SHORT',
            price: last.close,
            sl: last.close + (atr * 2),
            tp: last.close - (atr * 3)
          };
        }
      } catch (e) {
        return null;
      }
      return null;
    }

    async function startScan() {
      const status = document.getElementById('status');
      const grid = document.getElementById('signals');
      const tf = document.getElementById('timeframe').value;

      grid.innerHTML = '';
      status.innerText = 'Fetching USDT-M markets...';

      const pairs = await getUsdtPairs();
      status.innerText = `Scanning ${pairs.length} pairs on ${tf}...`;

      let count = 0;
      // Scan top volume pairs concurrently in batches
      const batchSize = 10;
      for (let i = 0; i < pairs.length; i += batchSize) {
        const batch = pairs.slice(i, i + batchSize);
        const results = await Promise.all(batch.map(p => analyzeSymbol(p, tf)));
        
        results.forEach(sig => {
          if (sig) renderSignal(sig);
        });

        count += batch.length;
        status.innerText = `Scanned ${count}/${pairs.length} pairs...`;
      }

      status.innerText = `Scan complete at ${new Date().toLocaleTimeString()}`;
    }

    function renderSignal(sig) {
      const grid = document.getElementById('signals');
      const card = document.createElement('div');
      card.className = 'card';
      
      const isLong = sig.type === 'LONG';
      const badgeClass = isLong ? 'badge long' : 'badge short';
      
      card.innerHTML = `
        <div class="card-header">
          <span class="symbol">${sig.symbol}</span>
          <span class="${badgeClass}">${sig.type}</span>
        </div>
        <div class="metrics">
          <div>Entry: <strong>${sig.price}</strong></div>
          <div>Stop Loss: <span class="val-short">${sig.sl.toFixed(4)}</span></div>
          <div>Take Profit: <span class="val-green">${sig.tp.toFixed(4)}</span></div>
          <div>R:R Ratio: <strong>1:1.5</strong></div>
        </div>
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Futures Order Block & Delta Scanner</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bullish-color: #22c55e;
            --bearish-color: #ef4444;
            --accent: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: #fff; }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        select, input, button {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
        }

        button {
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            margin-top: auto;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--bg-dark);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.1s ease;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .table-container {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(0,0,0,0.2);
            color: var(--text-muted);
            font-weight: 600;
        }

        tr:hover { background: rgba(255,255,255,0.02); }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            display: inline-block;
        }

        .badge-bull { background: rgba(34, 197, 94, 0.2); color: var(--bullish-color); }
        .badge-bear { background: rgba(239, 68, 68, 0.2); color: var(--bearish-color); }
        .badge-testing { background: rgba(234, 179, 8, 0.2); color: #eab308; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Order Block & Volume Delta Scanner (Binance Futures)</h1>
        <div id="status">Status: Ready</div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label>Timeframe</label>
            <select id="timeframe">
                <option value="15m">15m</option>
                <option value="1h" selected>1h</option>
                <option value="4h">4h</option>
                <option value="1d">1d</option>
            </select>
        </div>

        <div class="control-group">
            <label>Displacement (x ATR)</label>
            <input type="number" id="dispMult" value="1.5" step="0.1" min="0.5">
        </div>

        <div class="control-group">
            <label>Stop Loss (x ATR)</label>
            <input type="number" id="slMult" value="1.0" step="0.1" min="0.5">
        </div>

        <div class="control-group">
            <label>Take Profit (x ATR)</label>
            <input type="number" id="tpMult" value="3.0" step="0.5" min="1.0">
        </div>

        <button id="scanBtn" onclick="startScan()">Start Market Scan</button>

        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <div class="stats">
        <div>Pairs Evaluated: <span id="scannedCount" style="color: #fff;">0</span></div>
        <div>Active OBs Found: <span id="foundCount" style="color: #fff;">0</span></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Type</th>
                    <th>Zone Status</th>
                    <th>OB Range (Low - High)</th>
                    <th>Entry (Mid)</th>
                    <th>Stop Loss</th>
                    <th>Take Profit</th>
                    <th>R:R</th>
                    <th>OB Buy Vol %</th>
                    <th>Displacement Ratio</th>
                    <th>Touches</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <tr>
                    <td colspan="11" style="text-align:center; color: var(--text-muted); padding: 30px;">
                        Click "Start Market Scan" to scan Binance USDT-M Perpetual Pairs.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const BINANCE_BASE = 'https://fapi.binance.com';

    // Helper: Delay function to prevent 429 API rate limits
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function fetchUSDTMarketSymbols() {
        try {
            const res = await fetch(`${BINANCE_BASE}/fapi/v1/exchangeInfo`);
            const data = await res.json();
            return data.symbols
                .filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING' && s.contractType === 'PERPETUAL')
                .map(s => s.symbol);
        } catch (err) {
            console.error('Failed to fetch Binance symbols:', err);
            return [];
        }
    }

    async function fetchKlines(symbol, interval, limit = 200) {
        try {
            const res = await fetch(`${BINANCE_BASE}/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
            if (!res.ok) return null;
            const raw = await res.json();
            return raw.map(c => ({
                time: c[0],
                open: parseFloat(c[1]),
                high: parseFloat(c[2]),
                low: parseFloat(c[3]),
                close: parseFloat(c[4]),
                volume: parseFloat(c[5]),
                takerBuyVol: parseFloat(c[9])
            }));
        } catch (err) {
            return null;
        }
    }

    function calculateATR(klines, period = 14) {
        let atr = new Array(klines.length).fill(0);
        let trs = [];

        for (let i = 1; i < klines.length; i++) {
            const high = klines[i].high;
            const low = klines[i].low;
            const prevClose = klines[i - 1].close;

            const tr = Math.max(
                high - low,
                Math.abs(high - prevClose),
                Math.abs(low - prevClose)
            );
            trs.push(tr);

            if (i >= period) {
                const slice = trs.slice(i - period, i);
                atr[i] = slice.reduce((a, b) => a + b, 0) / period;
            }
        }
        return atr;
    }

    function analyzeSymbol(symbol, klines, config) {
        const { slMult, tpMult, dispMult } = config;
        if (!klines || klines.length < 50) return [];

        const atr = calculateATR(klines, 14);
        const lastIdx = klines.length - 1;
        const currentATR = atr[lastIdx];
        const currentPrice = klines[lastIdx].close;
        let foundOBs = [];

        // Scan backwards for recent pivot setups
        for (let i = klines.length - 20; i < klines.length - 2; i++) {
            const pivotHigh = klines[i].high > klines[i - 1].high && klines[i].high > klines[i + 1].high;
            const pivotLow = klines[i].low < klines[i - 1].low && klines[i].low < klines[i + 1].low;

            if (!pivotHigh && !pivotLow) continue;

            const atrAtPivot = atr[i] || currentATR;

            // --- BEARISH OB (SHORT) ---
            if (pivotHigh) {
                // Correct Displacement Math: Expansion down from pivot high to current price
                const disp = klines[i].high - currentPrice;
                if (disp >= (atrAtPivot * dispMult)) {
                    const top = klines[i].high;
                    const bot = klines[i].low;
                    const mid = (top + bot) / 2;

                    // CORRECTED TARGETS: SL is ABOVE pivot high, TP is BELOW entry
                    const sl = top + (currentATR * slMult);
                    const tp = mid - (currentATR * tpMult);

                    // CORRECTED VOLUME DELTA: Exclusively measured on OB candle [i]
                    const obVol = klines[i].volume;
                    const obTakerBuy = klines[i].takerBuyVol;
                    const buyPct = obVol > 0 ? (obTakerBuy / obVol) * 100 : 50;

                    let touches = 0;
                    let mitigated = false;
                    for (let j = i + 1; j <= lastIdx; j++) {
                        if (klines[j].high >= bot && klines[j].low <= top) touches++;
                        if (klines[j].high > top) { mitigated = true; break; }
                    }

                    if (!mitigated) {
                        foundOBs.push({
                            symbol,
                            type: 'BEARISH',
                            isBull: false,
                            top, bot, entry: mid, sl, tp,
                            rr: ((mid - tp) / (sl - mid)).toFixed(1),
                            buyPct: buyPct.toFixed(1),
                            dispRatio: (disp / atrAtPivot).toFixed(2),
                            touches,
                            isTesting: currentPrice >= bot && currentPrice <= top
                        });
                    }
                }
            }

            // --- BULLISH OB (LONG) ---
            if (pivotLow) {
                // Correct Displacement Math: Expansion up from pivot low to current price
                const disp = currentPrice - klines[i].low;
                if (disp >= (atrAtPivot * dispMult)) {
                    const top = klines[i].high;
                    const bot = klines[i].low;
                    const mid = (top + bot) / 2;

                    // CORRECTED TARGETS: SL is BELOW pivot low, TP is ABOVE entry
                    const sl = bot - (currentATR * slMult);
                    const tp = mid + (currentATR * tpMult);

                    // CORRECTED VOLUME DELTA: Exclusively measured on OB candle [i]
                    const obVol = klines[i].volume;
                    const obTakerBuy = klines[i].takerBuyVol;
                    const buyPct = obVol > 0 ? (obTakerBuy / obVol) * 100 : 50;

                    let touches = 0;
                    let mitigated = false;
                    for (let j = i + 1; j <= lastIdx; j++) {
                        if (klines[j].low <= top && klines[j].high >= bot) touches++;
                        if (klines[j].low < bot) { mitigated = true; break; }
                    }

                    if (!mitigated) {
                        foundOBs.push({
                            symbol,
                            type: 'BULLISH',
                            isBull: true,
                            top, bot, entry: mid, sl, tp,
                            rr: ((tp - mid) / (mid - sl)).toFixed(1),
                            buyPct: buyPct.toFixed(1),
                            dispRatio: (disp / atrAtPivot).toFixed(2),
                            touches,
                            isTesting: currentPrice >= bot && currentPrice <= top
                        });
                    }
                }
            }
        }

        return foundOBs;
    }

    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const resultsBody = document.getElementById('resultsBody');
        const scannedCountEl = document.getElementById('scannedCount');
        const foundCountEl = document.getElementById('foundCount');

        const config = {
            timeframe: document.getElementById('timeframe').value,
            dispMult: parseFloat(document.getElementById('dispMult').value),
            slMult: parseFloat(document.getElementById('slMult').value),
            tpMult: parseFloat(document.getElementById('tpMult').value)
        };

        scanBtn.disabled = true;
        statusEl.innerText = "Fetching market symbols...";
        resultsBody.innerHTML = '';
        progressBar.style.width = '0%';

        const symbols = await fetchUSDTMarketSymbols();
        if (symbols.length === 0) {
            statusEl.innerText = "Failed to load symbols.";
            scanBtn.disabled = false;
            return;
        }

        statusEl.innerText = `Scanning ${symbols.length} USDT Perpetual Pairs...`;

        let scanned = 0;
        let allOBs = [];
        const batchSize = 8;

        for (let i = 0; i < symbols.length; i += batchSize) {
            const batch = symbols.slice(i, i + batchSize);
            const batchPromises = batch.map(async (symbol) => {
                const klines = await fetchKlines(symbol, config.timeframe);
                if (klines) {
                    return analyzeSymbol(symbol, klines, config);
                }
                return [];
            });

            const results = await Promise.all(batchPromises);
            results.forEach(obs => allOBs.push(...obs));

            scanned += batch.length;
            scannedCountEl.innerText = scanned;
            foundCountEl.innerText = allOBs.length;
            progressBar.style.width = `${Math.min(100, (scanned / symbols.length) * 100)}%`;

            // Rate-limit throttle delay (80ms between batches)
            await sleep(80);
        }

        // Sort setups: Prioritize setups currently in the "TESTING ZONE"
        allOBs.sort((a, b) => b.isTesting - a.isTesting || b.dispRatio - a.dispRatio);

        renderResults(allOBs);
        statusEl.innerText = "Scan Complete";
        scanBtn.disabled = false;
    }

    function renderResults(obs) {
        const tbody = document.getElementById('resultsBody');
        if (obs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; padding: 30px;">No unmitigated order blocks found matching criteria.</td></tr>`;
            return;
        }

        tbody.innerHTML = obs.map(ob => `
            <tr>
                <td><strong>${ob.symbol}</strong></td>
                <td><span class="badge ${ob.isBull ? 'badge-bull' : 'badge-bear'}">${ob.type}</span></td>
                <td>${ob.isTesting ? '<span class="badge badge-testing">IN ZONE</span>' : '<span style="color:#64748b">Approaching</span>'}</td>
                <td>${ob.bot.toFixed(4)} - ${ob.top.toFixed(4)}</td>
                <td><strong>${ob.entry.toFixed(4)}</strong></td>
                <td style="color: var(--bearish-color);">${ob.sl.toFixed(4)}</td>
                <td style="color: var(--bullish-color);">${ob.tp.toFixed(4)}</td>
                <td>1 : ${ob.rr}</td>
                <td>${ob.buyPct}%</td>
                <td>${ob.dispRatio}x ATR</td>
                <td>${ob.touches}</td>
            </tr>
        `).map(x => x).join('');
    }
</script>

</body>
</html>
